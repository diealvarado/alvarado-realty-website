[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/invest"
  to = "/investors/"
  status = 301
  force = false

[[redirects]]
  from = "/invest/"
  to = "/investors/"
  status = 301
  force = false
